<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Write</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      width: 300px;
      padding: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #89b4fa;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a6adc8;
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      color: #cdd6f4;
      font-size: 13px;
      padding: 8px 10px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: #89b4fa;
    }

    .speed-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 14px;
    }

    .speed-group label {
      display: none;
    }

    .speed-btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid #45475a;
      border-radius: 6px;
      background: #313244;
      color: #a6adc8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .speed-btn:hover {
      border-color: #89b4fa;
      color: #cdd6f4;
    }

    .speed-btn.active {
      background: #89b4fa;
      border-color: #89b4fa;
      color: #1e1e2e;
      font-weight: 600;
    }

    .speed-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a6adc8;
      margin-bottom: 6px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    #start-btn {
      flex: 1;
      padding: 10px;
      background: #a6e3a1;
      border: none;
      border-radius: 6px;
      color: #1e1e2e;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
    }

    #start-btn:hover {
      background: #b9f1b4;
    }

    #start-btn:active {
      transform: scale(0.98);
    }

    #start-btn:disabled {
      background: #45475a;
      color: #6c7086;
      cursor: not-allowed;
      transform: none;
    }

    #stop-btn {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid #f38ba8;
      border-radius: 6px;
      color: #f38ba8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }

    #stop-btn.visible {
      display: block;
    }

    #stop-btn:hover {
      background: #f38ba820;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      color: #a6adc8;
    }

    #status.error {
      color: #f38ba8;
    }

    #status.success {
      color: #a6e3a1;
    }
  </style>
</head>
<body>
  <h1>Text to Write</h1>

  <label for="text-input">Text to type</label>
  <textarea id="text-input" placeholder="Enter text to type into the focused field…"></textarea>

  <div class="speed-label">Typing speed</div>
  <div class="speed-group">
    <div class="speed-btn" data-speed="slow">Slow</div>
    <div class="speed-btn active" data-speed="medium">Medium</div>
    <div class="speed-btn" data-speed="fast">Fast</div>
  </div>

  <div class="btn-row">
    <button id="start-btn">Type it</button>
    <button id="stop-btn">Stop</button>
  </div>
  <div id="status"></div>

  <script src="typing-options.js"></script>
  <script src="popup.js"></script>
</body>
</html>
